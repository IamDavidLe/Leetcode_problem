name: Process LeetCode Solutions

on:
  push:
    paths:
      - "**/*.py"
      - "**/metadata.json"
      - ".github/workflows/leetcode.yml"
      - ".github/scripts/process_leetcode.py"
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: leetcode-processing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  process:
    # The generated documentation commit should not start another run.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate solution documentation and progress index
        env:
          LEETCODE_USERNAME: JiaPark
        run: python .github/scripts/process_leetcode.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "chore: update LeetCode progress"
            git push
          fi
