name: Import LeetCode History

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leetcode-history-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Import accepted submissions
        env:
          LEETCODE_USERNAME: JiaPark
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
        run: python .github/scripts/import_leetcode_history.py

      - name: Generate documentation and progress index
        env:
          LEETCODE_USERNAME: JiaPark
        run: python .github/scripts/process_leetcode.py

      - name: Commit imported solutions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No imported changes to commit"
          else
            git commit -m "chore: import LeetCode history"
            git push
          fi
